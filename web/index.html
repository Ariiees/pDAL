<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pDAL vehicle-data demo</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #09111a; color: #dce8f4; }
    main { max-width: 840px; margin: 3rem auto; padding: 0 1.25rem; }
    h1 { letter-spacing: -.03em; }
    form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; background: #111f2d; padding: 1.25rem; border-radius: 12px; }
    label { display: grid; gap: .4rem; font-size: .85rem; color: #a9bfd2; }
    .wide { grid-column: 1 / -1; }
    input, select, button { border: 1px solid #31506a; border-radius: 7px; background: #0b1722; color: inherit; padding: .7rem; }
    button { background: #2d79b7; border-color: #4a9bdd; font-weight: 700; cursor: pointer; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #061019; border: 1px solid #263c50; padding: 1rem; border-radius: 8px; min-height: 7rem; }
    @media (max-width: 600px) { form { grid-template-columns: 1fr; } .wide { grid-column: auto; } }
  </style>
</head>
<body>
<main>
  <h1>Protected vehicle-data query</h1>
  <p>This browser uses the native pDAL API and logical resources only.</p>
  <form id="query-form">
    <label>Resource<select id="resource"></select></label>
    <label>Representation<select id="format"></select></label>
    <label>Start time (ns)<input id="start" inputmode="numeric" required></label>
    <label>End time (ns)<input id="end" inputmode="numeric" required></label>
    <label>Purpose<input id="purpose" value="diagnostics" required></label>
    <label>Maximum records<input id="limit" type="number" min="1" max="1000" value="25"></label>
    <button class="wide" type="submit">Request metadata</button>
  </form>
  <h2>Canonical result</h2>
  <pre id="result">Loading resource catalog…</pre>
</main>
<script>
const resource = document.querySelector('#resource');
const format = document.querySelector('#format');
const result = document.querySelector('#result');
let catalog = [];

function updateFormats() {
  const selected = catalog.find(item => item.resource_id === resource.value);
  format.replaceChildren(...(selected?.representations || []).map(item => {
    const option = document.createElement('option');
    option.value = item.format;
    option.textContent = `${item.format} (${item.content_type})`;
    return option;
  }));
}

async function loadCatalog() {
  const response = await fetch('/pdal/v1/resources');
  const body = await response.json();
  catalog = body.resources || [];
  resource.replaceChildren(...catalog.map(item => {
    const option = document.createElement('option');
    option.value = item.resource_id;
    option.textContent = `${item.semantic_name} — ${item.resource_id}`;
    return option;
  }));
  updateFormats();
  result.textContent = JSON.stringify(body, null, 2);
}

resource.addEventListener('change', updateFormats);
document.querySelector('#query-form').addEventListener('submit', async event => {
  event.preventDefault();
  result.textContent = 'Querying…';
  const body = {
    resources: [resource.value],
    time: {start_ns: document.querySelector('#start').value, end_ns: document.querySelector('#end').value},
    purpose: document.querySelector('#purpose').value,
    representation: {format: format.value},
    delivery: {mode: 'metadata', max_records: Number(document.querySelector('#limit').value)}
  };
  const response = await fetch('/pdal/v1/query', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-PDAL-Principal': 'demo-user', 'X-PDAL-Organization': 'local', 'X-PDAL-Role': 'service'},
    body: JSON.stringify(body)
  });
  const output = await response.json();
  result.textContent = JSON.stringify(output, null, 2);
});

loadCatalog().catch(error => { result.textContent = String(error); });
</script>
</body>
</html>
