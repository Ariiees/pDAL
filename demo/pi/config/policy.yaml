version: oem-demo-v1
plan_ttl_ns: 60000000000

roles:
  fleet_analyst:
    resources: [position]
    purposes: [fleet-monitoring]
    transformations: []
    max_time_span_ns: 1200000000000
    max_records: 50000
    max_bytes: 268435456

  service_technician:
    resources: [position, camera.front]
    purposes: [diagnostics]
    transformations: []
    max_time_span_ns: 1200000000000
    max_records: 50000
    max_bytes: 268435456

  incident_investigator:
    resources: [position, camera.front, lidar.top]
    purposes: [incident-investigation]
    transformations: []
    max_time_span_ns: 1200000000000
    max_records: 50000
    max_bytes: 268435456
